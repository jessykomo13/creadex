<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>WEngine</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
    }
    #canvas {
      display: block; width: 100vw; height: 100vh;
      outline: none;
    }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      background: #111; color: #ddd; font-family: sans-serif; z-index: 10;
    }
    #loading .bar {
      width: 70vw; max-width: 340px; height: 10px; border-radius: 6px;
      background: #333; overflow: hidden;
    }
    #loading .fill {
      height: 100%; width: 0%; background: #2f8fe0; transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>WEngine — chargement...</div>
    <div class="bar"><div class="fill" id="loadfill"></div></div>
  </div>
  <canvas id="canvas" tabindex="-1"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function(text) {
        var loading = document.getElementById('loading');
        if (!text) { if (loading) loading.style.display = 'none'; return; }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        var pct = this.totalDependencies ? 100 - Math.round((left / this.totalDependencies) * 100) : 0;
        var fill = document.getElementById('loadfill');
        if (fill) fill.style.width = pct + '%';
        if (left === 0) this.setStatus('');
      }
    };
    window.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
